<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#26121f"><title>Nicole's Date Night</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;color:#ffe9f0;background:radial-gradient(ellipse at 85% 5%,#77324f 0,transparent 45%),linear-gradient(140deg,#24131f,#4c2539 70%,#26131f);font-family:'DM Sans',sans-serif;min-height:100vh}main{max-width:580px;min-height:100svh;margin:auto;padding:22px 18px 35px;display:flex;flex-direction:column}h1,h2,h3{font-family:'Playfair Display',serif;font-weight:500}h1{font-size:clamp(48px,11vw,72px);font-style:italic;margin:0}h2{font-size:35px;margin:12px 0}p{line-height:1.55}.center{text-align:center}.eyebrow{font-size:11px;letter-spacing:.27em;text-transform:uppercase;color:#f5b4ce}.welcome{flex:1;min-height:75vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}.welcome .heart{font-size:100px;color:#ffa4cb;text-shadow:0 0 30px #e14f99}.welcome p{font-size:19px;max-width:340px}.btn{display:block;width:100%;padding:17px 22px;border-radius:40px;border:1px solid #f6b3d0;color:white;background:linear-gradient(120deg,#e18aa9,#9c3e6b);font:600 16px 'DM Sans',sans-serif;box-shadow:0 7px 24px #17081470;cursor:pointer;margin-top:13px}.btn.alt{background:transparent;box-shadow:none}.back{border:0;background:transparent;color:#ffd1e2;padding:10px 0;font:inherit;text-align:left;cursor:pointer}.progress{height:5px;background:#6b3e52;border-radius:10px;overflow:hidden;margin:15px 10px 25px}.progress>div{height:100%;background:#ffafcf;transition:width .3s}.sub{color:#f3c5d5;margin:0 0 22px}.choices{display:grid;gap:13px}.choice{width:100%;display:flex;gap:13px;text-align:left;align-items:center;background:#ffffff0b;border:1px solid #cf83a3;border-radius:20px;color:inherit;padding:10px;cursor:pointer}.choice:active{transform:scale(.99)}.choice img{width:105px;height:112px;object-fit:cover;border-radius:12px;background:#64364d;flex-shrink:0}.choice strong{display:block;font-size:18px}.choice small{display:block;font-size:12px;color:#e9aec5;margin:4px 0}.choice p{font-size:12px;margin:4px 0;line-height:1.4}.arrow{margin-left:auto;font-size:25px;color:#f3aaca}.confirm{flex:1;min-height:65vh;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}.confirm img{width:100%;height:32vh;max-height:290px;object-fit:cover;border-radius:24px;border:1px solid #f0a7c3}.period{font:normal 90px 'Great Vibes',cursive;color:#ffd4e4;text-shadow:0 0 30px #ff70ae;animation:appear .65s ease both}.confirm h2{margin-bottom:0}@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.85)}to{opacity:1;transform:none}}.custom{width:100%;padding:16px;border-radius:14px;background:#ffffff15;border:1px solid #d88ca9;color:white;font:inherit}.custom::placeholder{color:#e8b5c7}.finalhead{text-align:center;margin:16px 0 20px}.finalhead h2{font-size:39px}.poster{border-radius:24px;border:1px solid #f08ab9;background:linear-gradient(155deg,#512139,#271323 70%);box-shadow:0 0 35px #e65c9238;padding:18px 14px 22px}.poster .poster-title{text-align:center;font:italic 36px 'Playfair Display',serif;margin:8px 0 0;color:#ffe0ea}.poster .tag{text-align:center;color:#f5bbd1;font-size:11px;letter-spacing:.18em;margin:5px 0 20px}.panel{border:1px solid #e58bb0;border-radius:18px;overflow:hidden;margin:13px 0;background:#321829;box-shadow:0 0 15px #d9528830}.panel img{display:block;width:100%;height:155px;object-fit:cover}.panel .info{padding:13px 16px 16px}.panel small{color:#f3a8c7;letter-spacing:.16em;font-size:11px}.panel h3{font-size:27px;margin:6px 0}.panel p{font-size:13px;color:#f4c7d8;margin:0}.poster .closing{text-align:center;font:normal 68px 'Great Vibes',cursive;color:#ffb5d3;text-shadow:0 0 20px #f15d9c;margin:13px 0 0}.poster .closing-sub{text-align:center;font-size:12px;color:#f7c7d8}.note{text-align:center;color:#f0c0d1;font-size:12px;line-height:1.5}.actionrow{display:grid;gap:10px;margin-top:18px}.hidden{display:none}</style></head><body><main id="app"></main><script>
const dinner=[{name:'Yard House',place:'The Fountains at Roseville',desc:'Good food, drinks, and a stroll around the Fountains together afterward. No rush.',photo:'dinner.svg'},{name:'Al’s',place:'Near the Roseville fairgrounds',desc:'A laid-back dinner, comfort food, and plenty of time to enjoy each other’s company.',photo:'dinner.svg'},{name:'Old Sacramento',place:'Historic waterfront by the Sacramento River',desc:'Wander the old streets, explore the waterfront, and pick whichever restaurant catches our eye.',photo:'waterfront.svg'},{name:'Nicole’s Choice',place:'Your pick, beautiful',desc:'Something else sound better? Tell me what you’re craving and we’ll make it happen.',photo:'choice.svg'}];
const activities=[{name:'Bowling',place:'Lucky Strike Rocklin · Lonetree Boulevard',desc:'A little friendly competition, some laughs, and the perfect excuse to get closer.',photo:'bowling.svg'},{name:'Color Me Mine',place:'Lonetree Boulevard, Rocklin',desc:'Pick out pottery, paint together, and make something we can keep from our night.',photo:'pottery.svg'},{name:'Old Sacramento Adventure',place:'Old Sacramento Waterfront',desc:'Explore the historic streets, enjoy the river, and stop wherever looks interesting.',photo:'waterfront.svg'},{name:'Nicole’s Choice',place:'Your idea, our adventure',desc:'Have something else in mind? You pick what we do, and I’m in.',photo:'choice.svg'}];
let step='welcome',chosen={dinner:null,activity:null},draft=null;const app=document.getElementById('app');function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(s){step=s;render();window.scrollTo(0,0)}function pick(i){draft=(step==='dinner'?dinner:activities)[i];if(i===3){show(step==='dinner'?'customDinner':'customActivity')}else commit(draft)}function commit(o){if(step==='dinner'||step==='customDinner'){chosen.dinner=o;show('confirmDinner')}else{chosen.activity=o;show('confirmActivity')}}function custom(){const el=document.getElementById('customText');let v=el.value.trim();if(!v){el.focus();return}commit({...draft,name:v,place:'Nicole’s choice',desc:'You picked it, and I’m looking forward to it.'})}function back(){show(step==='activity'?'confirmDinner':step==='dinner'?'welcome':'activity')}function card(o,i){return `<button class="choice" onclick="pick(${i})"><img src="${o.photo}" alt="" loading="lazy"><div><strong>${esc(o.name)}</strong><small>${esc(o.place)}</small><p>${esc(o.desc)}</p></div><span class="arrow">›</span></button>`}function panel(o,n,kind){return `<section class="panel"><img src="${o.photo}" alt=""><div class="info"><small>${n} — ${kind}</small><h3>${esc(o.name)}</h3><p>${esc(o.place)}. ${esc(o.desc)}</p></div></section>`}
function render(){if(step==='welcome'){app.innerHTML=`<section class="welcome"><div class="eyebrow">A date night just for us</div><div class="heart">♡</div><h1>Hey Nicole,</h1><p>I’ve planned a special night for us, but you get to make the choices.</p><button class="btn" onclick="show('dinner')">Plan Our Date →</button></section>`;return}if(step==='dinner'||step==='activity'){const d=step==='dinner';app.innerHTML=`<button class="back" onclick="back()">← Back</button><div class="center"><span class="eyebrow">Step ${d?1:2} of 3</span><div class="progress"><div style="width:${d?33:66}%"></div></div><h2>${d?'Pick Our Dinner Spot':'Choose Our Activity'}</h2><p class="sub">${d?'Where would you like to eat for our date night?':'What sounds fun after dinner?'}</p></div><div class="choices">${(d?dinner:activities).map(card).join('')}</div>`;return}if(step.startsWith('custom')){let d=step==='customDinner';app.innerHTML=`<button class="back" onclick="show('${d?'dinner':'activity'}')">← Back</button><section class="welcome"><span class="eyebrow">Nicole’s choice</span><h2>What are you thinking?</h2><p>${d?'Where are we eating?':'What adventure should we go on?'}</p><input id="customText" class="custom" maxlength="100" placeholder="Your idea goes here…"><button class="btn" onclick="custom()">Period. That’s the one →</button></section>`;return}if(step.startsWith('confirm')){let d=step==='confirmDinner',o=d?chosen.dinner:chosen.activity;app.innerHTML=`<button class="back" onclick="show('${d?'dinner':'activity'}')">← Change my choice</button><section class="confirm"><img src="${o.photo}" alt=""><h2>${esc(o.name)}?</h2><div class="period">Period.</div><p class="sub">Excellent choice.</p></section><button class="btn" onclick="show('${d?'activity':'summary'}')">${d?'Continue to Activities':'See Our Date'} →</button>`;return}let d=chosen.dinner,a=chosen.activity;app.innerHTML=`<button class="back" onclick="show('activity')">← Change my activity</button><div class="finalhead"><span class="eyebrow">Step 3 of 3 · It's official</span><h2>It's a date, Nicole.</h2><p class="sub">You chose. Now it's a date.</p></div><div class="poster" id="poster"><div class="eyebrow center">The official date night itinerary</div><div class="poster-title">Nicole's Date Night</div><div class="tag">A NIGHT JUST FOR US</div>${panel(d,'01','DINNER')}${panel(a,'02','OUR ADVENTURE')}<section class="panel"><img src="gta-night.jpg" alt="GTA VI-inspired artwork"><div class="info"><small>03 — AFTER HOURS</small><h3>GTA VI & whatever else</h3><p>Back at home, you get the controller and GTA 6 is all yours. I'll be right there keeping you company, stealing kisses, and maybe distracting you a little. The rest of the night? We'll see where it takes us.</p></div></section><div class="closing">Period.</div><div class="closing-sub">Can't wait to spend this night with you.</div></div><div class="actionrow"><button class="btn" onclick="saveCard()">Save Our Date Card</button><button class="btn alt" onclick="shareCard()">Send Our Date</button><button class="btn alt" onclick="show('dinner')">Change Our Plans</button></div><p class="note">Save creates a shareable PNG with Nicole’s actual choices. On iPhone, use Share to send it through Messages.</p>`}
const W=900;function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function wrap(ctx,t,x,y,max,line){let words=t.split(' '),s='',yy=y;for(let word of words){let z=s?s+' '+word:word;if(ctx.measureText(z).width>max&&s){ctx.fillText(s,x,yy);yy+=line;s=word}else s=z}if(s){ctx.fillText(s,x,yy);yy+=line}return yy}function load(src){return new Promise(resolve=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=src})}async function createCard(){const c=document.createElement('canvas');c.width=W;c.height=1810;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,900,1810);g.addColorStop(0,'#562039');g.addColorStop(.6,'#281326');g.addColorStop(1,'#491d37');x.fillStyle=g;x.fillRect(0,0,900,1810);x.strokeStyle='#f18cba';x.lineWidth=4;round(x,22,22,856,1765,36);x.stroke();x.textAlign='center';x.fillStyle='#f4b7d0';x.font='24px Georgia';x.fillText('THE OFFICIAL DATE NIGHT ITINERARY',450,90);x.fillStyle='#ffe1ec';x.font='italic 64px Georgia';x.fillText("Nicole's Date Night",450,166);x.font='23px Arial';x.fillStyle='#e9aec7';x.fillText('YOU CHOSE. NOW IT’S A DATE.',450,215);x.textAlign='left';const blocks=[{...chosen.dinner,label:'01  /  DINNER'},{...chosen.activity,label:'02  /  OUR ADVENTURE'},{name:'GTA VI & whatever else',label:'03  /  AFTER HOURS',photo:'gta-night.jpg',desc:"Back at home, YOU get the controller. GTA 6 is all yours. I'll be there stealing kisses, maybe distracting you, and seeing where the night takes us."}];for(let k=0;k<3;k++){let o=blocks[k],top=245+k*455;x.fillStyle='#371c2f';round(x,48,top,804,438,25);x.fill();x.strokeStyle='#d77da5';x.lineWidth=2;x.stroke();let im=await load(o.photo);if(im){x.save();round(x,62,top+13,776,215,17);x.clip();let ratio=Math.max(776/im.width,215/im.height),ww=im.width*ratio,hh=im.height*ratio;x.drawImage(im,62+(776-ww)/2,top+13+(215-hh)/2,ww,hh);x.restore()}x.fillStyle='#f3a8c6';x.font='19px Arial';x.fillText(o.label,76,top+260);x.fillStyle='#fff1f5';x.font='34px Georgia';let name=o.name.length>34?o.name.slice(0,33)+'…':o.name;x.fillText(name,76,top+310);x.font='21px Arial';x.fillStyle='#f1c8d8';let copy=k===2?o.desc:o.place+' — '+o.desc;wrap(x,copy,76,top+346,735,28)}x.textAlign='center';x.fillStyle='#ffb3d2';x.font='italic 78px Georgia';x.fillText('Period.',450,1662);x.font='23px Arial';x.fillStyle='#f6ccdc';x.fillText("Can't wait to spend this night with you.",450,1723);return new Promise(r=>c.toBlob(r,'image/png'))}async function saveCard(){let b=await createCard();if(!b){alert('Could not generate the image.');return}let url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='Nicole-Date-Night.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function shareCard(){let b=await createCard();let f=new File([b],'Nicole-Date-Night.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Nicole's Date Night"});return}catch(e){if(e.name==='AbortError')return}}await saveCard();alert('Date card saved. Open the image in Photos or Files and share it through Messages.')}render();
</script></body></html>
